name: Ingest GitHub Good First Issues

on:
  schedule:
    # Run twice daily at 04:00 and 16:00 UTC
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ingest:
    name: Fetch and Upsert Good First Issues
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run GitHub Issues Ingest Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Authenticated PAT or default GitHub Actions token for 30 req/min Search API rate limit
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/ingest-github-issues.mjs
